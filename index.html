<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接龍：經典紙牌遊戲</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background: linear-gradient(180deg, #0B6B3A 0%, #0d4d2c 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 32px;
    margin: 16px 0 8px;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    opacity: 0.9;
  }
  .links {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.button {
    display: block;
    background: #fff;
    color: #0B6B3A;
    text-decoration: none;
    font-weight: bold;
    padding: 14px;
    border-radius: 26px;
    font-size: 16px;
  }
  a.text-link {
    color: #cde9d8;
    font-size: 14px;
    text-decoration: underline;
  }
  .emoji {
    font-size: 56px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🃏</div>
    <h1>接龍：經典紙牌遊戲</h1>
    <p>經典克朗代克紙牌接龍，保證可解的每日挑戰、精美主題與離線遊玩。</p>
    <div class="links">
      <a class="button" href="https://play.google.com/store/apps/details?id=com.yusakuron.solitaire">
        在 Google Play 下載
      </a>
      <a class="text-link" href="https://yusakuron4-hub.github.io/solitaire-privacy-policy/">
        隱私權政策
      </a>
    </div>
  </div>
</body>
</html>
